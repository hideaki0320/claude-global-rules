name: Sync global rules to all repos

on:
  push:
    branches: [main]
    paths: [global.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync global.md to .claude/rules/global.md in target repos
        env:
          GH_PAT: ${{ secrets.CLAUDE_SYNC_PAT }}
        run: |
          set -euo pipefail

          GLOBAL_CONTENT=$(base64 -w 0 global.md)
          TARGET_PATH=".claude/rules/global.md"

          while IFS= read -r repo; do
            [[ -z "$repo" || "$repo" == \#* ]] && continue
            repo=$(echo "$repo" | tr -d '\r' | xargs)
            [[ -z "$repo" ]] && continue

            echo "--- Syncing to hideaki0320/$repo ---"

            # Check if .claude/rules/global.md already exists
            RESPONSE=$(curl -sf \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/hideaki0320/$repo/contents/$TARGET_PATH" 2>/dev/null || echo '{}')

            SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo '')

            # Create or update .claude/rules/global.md
            JSON_DATA="{\"message\":\"chore: sync global rules from claude-global-rules\",\"content\":\"$GLOBAL_CONTENT\",\"branch\":\"main\""
            if [ -n "$SHA" ]; then
              JSON_DATA="$JSON_DATA,\"sha\":\"$SHA\""
            fi
            JSON_DATA="$JSON_DATA}"

            RESULT=$(curl -sf -X PUT \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/hideaki0320/$repo/contents/$TARGET_PATH" \
              -d "$JSON_DATA" 2>&1) && echo "Done: $repo" || echo "FAILED: $repo - $RESULT"

          done < sync-targets.txt

          echo "=== Sync complete ==="
